name: Parse tickets

on:
  # Запускать каждые 30 минут
  schedule:
    - cron: '*/30 * * * *'
  # Плюс возможность запустить вручную (кнопка Run workflow)
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # нужно, чтобы коммитить обратно в репозиторий

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run parser
        run: python afisha_updater.py

      - name: Commit and push afisha_data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add afisha_data.json
          git diff --staged --quiet || git commit -m "Update tickets data [skip ci]"
          git push
